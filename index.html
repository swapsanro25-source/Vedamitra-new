<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VEDAMITRA — Your Personal AI Study Companion</title>
<meta name="description" content="VEDAMITRA is a premium AI study companion for ICSE Class 10 students preparing for the ICSE 2027 examinations." />
<meta name="theme-color" content="#1E293B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="VEDAMITRA" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<link rel="apple-touch-icon" href="assets/logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Splash screen -->
  <div id="splash">
    <div class="splash-logo-tile"><img src="assets/logo.svg" alt="VEDAMITRA" class="splash-logo" /></div>
    <div class="splash-name">VEDAMITRA</div>
    <div class="splash-tagline">Your ICSE 2027 Academic Companion</div>
    <div class="splash-bar"></div>
    <div class="splash-status" id="splash-status"></div>
  </div>

  <div id="app-root"></div>

  <!-- Data first, then storage/state, then planner, then UI helpers, then render, then app -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
