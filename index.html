<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedamitra Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <header class="glass-panel">
            <h1>My Studies</h1>
            <p>Welcome back! Let's get to work.</p>
        </header>

        <main class="grid-layout">
            <!-- Neomorphic Button -->
            <button class="neo-button" id="openTasksBtn">Open Tasks</button>

            <!-- Glassmorphic Expanding Card -->
            <div class="glass-card expandable" id="taskCard">
                <h2>Current Assignments</h2>
                <div class="card-content">
                    <div class="task-item">
                        <span class="indicator green"></span>
                        <p>Physics Chapter 4</p>
                    </div>
                    <div class="task-item">
                        <span class="indicator orange"></span>
                        <p>Math Assignment</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
